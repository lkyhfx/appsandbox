[Service]
# The production Mesa build publishes Mutter's final D3D12 color target to
# the encoder helper. Keep the historical filename so existing image upgrade
# scripts replace the old "no-gpu" drop-in in place.
Environment=LD_LIBRARY_PATH=/opt/wsl-mesa/lib/x86_64-linux-gnu:/opt/appsandbox/wsl-deps:/usr/lib/wsl/lib
Environment=GALLIUM_DRIVER=d3d12
Environment=MESA_LOADER_DRIVER_OVERRIDE=d3d12
Environment=__GLX_VENDOR_LIBRARY_NAME=mesa
Environment=ASB_MUTTER_D3D12_SHARE_SOCKET=/run/appsandbox/display-d3d12.sock
